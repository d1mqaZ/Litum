<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расчёт теоретического расхода — Litum</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --light-bg: #f5f7fa;
            --card-bg: white;
            --text: #333;
            --border: #ccc;
            --shadow: 0 4px 20px rgba(0,0,0,0.12);
            --accent: #0d6efd;
            --accent-hover: #0b5ed7;
            --input-focus: rgba(13, 110, 253, 0.15);
            --result-bg: #f8f9fa;
            --result-border: #0d6efd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: var(--light-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 28px;
            max-width: 1200px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            max-height: 140px;
            display: block;
            margin: 0 auto 16px;
            object-fit: contain;
        }

        .logo .subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            margin-top: 20px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .calculate-btn {
            background: var(--accent);
            color: white;
        }

        .calculate-btn:hover {
            background: var(--accent-hover);
        }

        .pdf-btn {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 14px 14px 8px 14px;
            text-align: center;
        }

        .pdf-btn:hover {
            background: #218838;
        }

        .pdf-btn-text {
            display: block;
            margin-bottom: 4px;
        }

        .pdf-hint {
            color: white;
            font-size: 11px;
            margin-top: 4px;
            text-align: center;
            width: 100%;
        }

        .results-section {
            background: var(--result-bg);
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--result-border);
            font-size: 15px;
            line-height: 1.5;
        }

        .results-section h2 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .result-label {
            font-weight: 500;
            color: #333;
        }

        .result-value {
            font-weight: 700;
            color: #0d4a7f;
        }

        @media (min-width: 1024px) {
            .form-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .button-group {
                flex-direction: row;
                align-items: center;
            }

            .pdf-hint {
                order: 2;
                margin-top: 0;
                text-align: center;
            }
        }

        @media (max-width: 1023px) and (min-width: 768px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 767px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 16px;
            }

            .logo img {
                max-height: 120px;
            }

            .logo .subtitle {
                font-size: 13px;
            }

            .section-title {
                font-size: 16px;
            }

            .result-item {
                flex-direction: column;
            }

            .result-value {
                margin-top: 4px;
            }

            .button-group {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 16px;
            }

            .logo img {
                max-height: 100px;
            }

            .section-title {
                font-size: 15px;
            }

            input {
                padding: 12px 10px;
                font-size: 16px;
            }

            button {
                padding: 16px;
                font-size: 16px;
            }

            .result-value {
                font-size: 14px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
                padding: 20px;
                max-width: 100%;
            }

            .form-section, .button-group {
                display: none;
            }

            .results-section {
                border: 1px solid #ccc;
                background: white;
            }

            .results-section h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .result-label {
                font-weight: bold;
            }

            .print-header {
                text-align: center;
                margin-bottom: 20px;
            }

            .print-header img {
                max-height: 80px;
                display: block;
                margin: 0 auto 10px;
            }

            .print-header h1 {
                font-size: 22px;
                margin: 0;
            }

            .print-header p {
                font-size: 13px;
                color: #666;
                margin: 5px 0 0;
            }

            .result-item {
                padding: 6px 0;
                font-size: 14px;
            }

            .result-label {
                font-size: 14px;
            }

            .result-value {
                font-size: 14px;
            }

            .print-data {
                page-break-inside: avoid;
                margin-bottom: 20px;
                padding: 16px;
                border: 1px solid #ddd;
                background: white;
            }

            .print-data h3 {
                margin-top: 0;
                font-size: 16px;
                color: #333;
                padding-bottom: 8px;
                border-bottom: 1px solid #eee;
                font-weight: 500;
            }

            .print-data-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 16px;
                margin-top: 10px;
            }

            .print-data-item {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .print-data-label {
                font-weight: 500;
                font-size: 13px;
                color: #333;
            }

            .print-data-value {
                font-weight: 700;
                font-size: 14px;
                color: #0d4a7f;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="Litum logo.png" alt="Litum logo">
            <div class="subtitle">Расчёт теоретического расхода краски</div>
        </div>

        <div class="input-group">
            <div class="form-group">
                <label for="product">Продукт:</label>
                <input list="paint_list" id="product" value="" placeholder="Выберите или введите продукт">
                <datalist id="paint_list">
                    <option value="Литабонд Винил">
                    <option value="Литабонд">
                    <option value="Литакоут Акрил">
                    <option value="Литакоут Алкид">
                    <option value="Литакоут Классик">
                    <option value="Литакоут Матт">
                    <option value="Литакоут Плюс">
                    <option value="Литакоут Флекси">
                    <option value="Литакоут Фрост">
                    <option value="Литакоут Фрост  ">
                    <option value="Литакоут Фрост У  ">
                    <option value="Литакоут Футура">
                    <option value="Литакоут Экспресс Алкид">
                    <option value="Литакоут Эпокс">
                    <option value="Литалак Сил">
                    <option value="Литамастик 180">
                    <option value="Литамастик 190">
                    <option value="Литамастик 190 Ст">
                    <option value="Литамастик 280">
                    <option value="Литамастик 287">
                    <option value="Литамастик 290">
                    <option value="Литамастик 290 Ст">
                    <option value="Литамастик Универсал 10">
                    <option value="Литамастик Универсал 20">
                    <option value="Литапрайм 500">
                    <option value="Литапрайм Акрил">
                    <option value="Литапрайм Гидро">
                    <option value="Литапрайм Сил">
                    <option value="Литапрайм Спринт">
                    <option value="Литапрайм Финиш">
                    <option value="Литапрайм Цинк 80">
                    <option value="Литапрайм Цинк ЭС">
                    <option value="Литапрайм Экспресс Алкид">
                    <option value="Литапрайм Экспресс МИО">
                    <option value="Литапрайм Экспресс Мульти">
                    <option value="Литапрайм Экспресс">
                    <option value="Литапрайм Экспресс Ф">
                    <option value="Литатанк АС">
                    <option value="Литатанк Классик">
                    <option value="Литатанк Плюс">
                    <option value="Литатанк Стандарт">
                    <option value="Литатанк Стронг">
                    <option value="Литатанк ЦПВ">
                    <option value="Литатерм 250">
                    <option value="Литатерм Финиш">
                    <option value="Литатерм Цинк 540">
                    <option value="Литатерм Цинк ЭС">
                    <option value="Литачар Акрил">
                    <option value="Литачар Изотерм Э">
                    <option value="Литачар Эпокс">
                    <option value="Литум Бриз">
                    <option value="Литум Колор ОР">
                    <option value="Литум Сирокко">
                    <option value="Литум Шоппраймер Цинк">
                    <option value="Литум Шоппраймер ЭП">
                    <option value="Литум Экстрим">
                </datalist>
            </div>

            <div class="form-group">
                <label for="color">Цвет:</label>
                <input type="text" id="color" value="" placeholder="Например Серый">
            </div>

            <div class="form-group">
                <label for="batch_number">Номер партии:</label>
                <input type="text" id="batch_number" value="" placeholder="например LO0-2222.1.2">
            </div>
        </div>

        <section class="form-section">
            <h2 class="section-title">📊 Данные для расчета</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="dft">Толщина сухой плёнки (DFT), мкм:</label>
                    <input type="number" id="dft" value="34" step="0.1" placeholder="Например: 34" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="mass_blank">Вес стекла без краски (г):</label>
                    <input type="number" id="mass_blank" value="54.5547" step="0.0001" placeholder="Например: 54.5547" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="mass_wet">Вес стекла с мокрой краской (г):</label>
                    <input type="number" id="mass_wet" value="55.0467" step="0.0001" placeholder="Например: 55.0467" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="mass_dry">Вес стекла с сухой краской (г):</label>
                    <input type="number" id="mass_dry" value="54.8940" step="0.0001" placeholder="Например: 54.8940" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="length_mm">Длина пленки (мм):</label>
                    <input type="number" id="length_mm" value="100" step="0.1" placeholder="Например: 100" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="width_mm">Ширина пленки (мм):</label>
                    <input type="number" id="width_mm" value="64.65" step="0.1" placeholder="Например: 64.65" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="ms_percent">МДНВ (для 2-комп. смесь А+В), %:</label>
                    <input type="number" id="ms_percent" value="66.61" step="0.01" min="0" max="100" placeholder="Например: 66.61" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="rho_wet">Плотность краски (для 2-комп. смесь А+В), г/см³:</label>
                    <input type="number" id="rho_wet" value="1.269" step="0.001" placeholder="Например: 1.269" inputmode="decimal">
                </div>

                <div class="form-group">
                    <label for="contrast">Коэффициент контрастности (0–1):</label>
                    <input type="number" id="contrast" value="0.87" step="0.01" min="0" max="1" placeholder="Например: 0.87" inputmode="decimal">
                </div>
            </div>

            <div class="button-group">
                <button class="calculate-btn" onclick="calculate()">🚀 Рассчитать</button>
                <button class="pdf-btn" onclick="printWithAllData()">
                    <span class="pdf-btn-text">📄 Сохранить результаты в формате PDF</span>
                    <div class="pdf-hint">Чтобы сохранить в формате PDF, в поле "Принтер" выберите "Сохранить как PDF"</div>
                </button>
            </div>
        </section>

        <section class="results-section">
            <h2>📈 Результаты расчёта</h2>
            <div id="result">
                <div class="result-item">
                    <span class="result-label">Введите данные и нажмите "Рассчитать"</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        function calculate() {
            const product = document.getElementById('product').value;
            const color = document.getElementById('color').value;
            const batchNumber = document.getElementById('batch_number').value;
            const dft = parseFloat(document.getElementById('dft').value);
            const mass_blank = parseFloat(document.getElementById('mass_blank').value);
            const mass_wet_full = parseFloat(document.getElementById('mass_wet').value);
            const mass_dry_full = parseFloat(document.getElementById('mass_dry').value);
            const L_mm = parseFloat(document.getElementById('length_mm').value);
            const W_mm = parseFloat(document.getElementById('width_mm').value);
            const ms_percent = parseFloat(document.getElementById('ms_percent').value);
            const rho_wet = parseFloat(document.getElementById('rho_wet').value);
            const contrast = parseFloat(document.getElementById('contrast').value);

            if (isNaN(dft) || isNaN(mass_blank) || isNaN(mass_wet_full) || isNaN(mass_dry_full) || isNaN(L_mm) || isNaN(W_mm) || isNaN(ms_percent) || isNaN(rho_wet) || isNaN(contrast) ||
                dft <= 0 || mass_blank <= 0 || mass_wet_full <= mass_blank || mass_dry_full <= mass_blank || L_mm <= 0 || W_mm <= 0 || ms_percent < 0 || ms_percent > 100 || rho_wet <= 0 || contrast < 0 || contrast > 1) {
                document.getElementById('result').innerHTML = `
                    <div class="result-item">
                        <span class="result-label">⚠️ Ошибка:</span>
                        <span class="result-value">Пожалуйста, введите корректные данные.</span>
                    </div>
                `;
                return;
            }

            // Рассчитываем массу мокрой и сухой плёнки
            const m_wet = mass_wet_full - mass_blank;
            const m_dry = mass_dry_full - mass_blank;

            // Переводим мм в см
            const L_cm = L_mm / 10;
            const W_cm = W_mm / 10;
            const A = L_cm * W_cm; // площадь в см²

            const V_dry = (A * dft) / 10000; // объём сухой плёнки в см³
            const rho_dry = m_dry / V_dry; // плотность сухой плёнки

            // Объёмное содержание сухого остатка
            const volume_wet = m_wet / rho_wet; // объём мокрой краски в см³
            const vs_percent = (V_dry / volume_wet) * 100; // объёмное содержание сухого остатка в %

            // Расход без учёта контрастности
            const R_no_contrast = dft / (10 * vs_percent);

            // Расход с учётом контрастности
            const R_with_contrast = R_no_contrast / contrast;

            // Покрытие без и с контрастностью
            const coverage_no_contrast_m2_per_l = 1 / R_no_contrast;
            const coverage_with_contrast_m2_per_l = 1 / R_with_contrast;

            const coverage_no_contrast_m2_per_kg = 1 / (R_no_contrast * rho_wet);
            const coverage_with_contrast_m2_per_kg = 1 / (R_with_contrast * rho_wet);

            document.getElementById('result').innerHTML = `
                <div class="result-item">
                    <span class="result-label">Продукт:</span>
                    <span class="result-value">${product || 'Не указано'}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Цвет:</span>
                    <span class="result-value">${color || 'Не указано'}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Номер партии:</span>
                    <span class="result-value">${batchNumber || 'Не указано'}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Масса мокрой плёнки:</span>
                    <span class="result-value">${m_wet.toFixed(4)} г</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Масса сухой плёнки:</span>
                    <span class="result-value">${m_dry.toFixed(4)} г</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Площадь пленки:</span>
                    <span class="result-value">${A.toFixed(2)} см²</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Плотность сухой плёнки:</span>
                    <span class="result-value">${rho_dry.toFixed(4)} г/см³</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Объём мокрой краски:</span>
                    <span class="result-value">${volume_wet.toFixed(4)} см³</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Объём сухой плёнки:</span>
                    <span class="result-value">${V_dry.toFixed(4)} см³</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Расчетное ОДНВ:</span>
                    <span class="result-value">${vs_percent.toFixed(2)}%</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Расход без учёта контрастности:</span>
                    <span class="result-value">${R_no_contrast.toFixed(4)} л/м², ${coverage_no_contrast_m2_per_l.toFixed(2)} м²/л, ${coverage_no_contrast_m2_per_kg.toFixed(2)} м²/кг</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Расход с учётом контрастности:</span>
                    <span class="result-value">${R_with_contrast.toFixed(4)} л/м², ${coverage_with_contrast_m2_per_l.toFixed(2)} м²/л, ${coverage_with_contrast_m2_per_kg.toFixed(2)} м²/кг</span>
                </div>
            `;
        }

        function printWithAllData() {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ru">
                <head>
                    <meta charset="UTF-8">
                    <title>Результаты расчёта</title>
                    <style>
                        @page {
                            size: A4;
                            margin: 1cm;
                        }
                        body {
                            font-family: Arial, sans-serif;
                            padding: 0;
                            margin: 0;
                            font-size: 14px;
                        }

                            text-align: center;
                            margin-bottom: 20px;
                        }

                            max-height: 60px;

                            margin: 0 auto 10px;
                        }

                            font-size: 18px;
                            margin: 0;
                        }
                        .print-header p {
                            font-size: 12px;
                            color: #666;
                            margin: 5px 0 0;
                        }
                        .print-data {
                            page-break-inside: avoid;
                            margin-bottom: 20px;

                            border: 1px solid #ddd;
                            background: white;
                        }
                        .print-data h3 {
                            margin-top: 0;
                            font-size: 16px;
                            color: #333;
                            padding-bottom: 8px;
                            border-bottom: 1px solid #eee;
                            font-weight: 500;
                        }
                        .print-data-grid {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                            gap: 16px;
                            margin-top: 10px;
                        }
                        .print-data-item {
                            display: flex;
                            flex-direction: column;
                            gap: 4px;
                        }
                        .print-data-label {
                            font-weight: 500;
                            font-size: 13px;
                            color: #333;
                        }
                        .print-data-value {
                            font-weight: 700;
                            font-size: 14px;
                            color: #0d4a7f;
                        }
                        .result-item {
                            padding: 6px 0;
                            border-bottom: 1px solid #eee;
                            display: flex;
                            justify-content: space-between;
                        }
                        .result-label {
                            font-weight: bold;
                            flex: 1;
                        }
                        .result-value {
                            font-weight: bold;
                            text-align: right;
                            flex: 1;
                        }
                    </style>
                </head>
                <body>
                    <div class="print-header">
                        <img src="${document.querySelector('.logo img').src}" alt="Litum logo">
                        <h1>Расчёт теоретического расхода краски</h1>
                        <p>Результаты расчёта</p>
                    </div>

                    <div class="print-data">
                        <h3>📊 Данные для расчета</h3>
                        <div class="print-data-grid">
                            <div class="print-data-item">
                                <span class="print-data-label">Толщина сухой плёнки (DFT), мкм:</span>
                                <span class="print-data-value">${document.getElementById('dft').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Вес стекла без краски (г):</span>
                                <span class="print-data-value">${document.getElementById('mass_blank').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Вес стекла с мокрой краской (г):</span>
                                <span class="print-data-value">${document.getElementById('mass_wet').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Вес стекла с сухой краской (г):</span>
                                <span class="print-data-value">${document.getElementById('mass_dry').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Длина пленки (мм):</span>
                                <span class="print-data-value">${document.getElementById('length_mm').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Ширина пленки (мм):</span>
                                <span class="print-data-value">${document.getElementById('width_mm').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">МДНВ (для 2-комп. смесь А+В), %:</span>
                                <span class="print-data-value">${document.getElementById('ms_percent').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Плотность краски (для 2-комп. смесь А+В), г/см³:</span>
                                <span class="print-data-value">${document.getElementById('rho_wet').value}</span>
                            </div>
                            <div class="print-data-item">
                                <span class="print-data-label">Коэффициент контрастности (0–1):</span>
                                <span class="print-data-value">${document.getElementById('contrast').value}</span>
                            </div>
                        </div>
                    </div>

                    <div id="print-results">
                        ${document.getElementById('result').innerHTML}
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        window.onload = calculate;
    </script>

</body>
</html>
